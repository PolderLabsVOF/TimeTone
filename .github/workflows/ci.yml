name: CI
on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --allow-scripts=npm:better-sqlite3
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Upload web runtime
        uses: actions/upload-artifact@v4
        with:
          name: timetone-web-${{ github.sha }}
          path: |
            web/.next/standalone
            web/.next/static
            web/public
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - working-directory: firmware
        run: . /opt/esp/idf/export.sh && idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: timetone-firmware-${{ github.sha }}
          path: firmware/build/timetone.bin
          if-no-files-found: error
          retention-days: 14
