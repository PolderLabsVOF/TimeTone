services:
  timekeep:
    image: timetone:release
    build: .
    restart: unless-stopped
    ports:
      - "${TIMETONE_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/timekeep.db
      TIMETONE_INSTALL_MODE: docker
      # Server-rendered dashboard dates use the office timezone. Override
      # TIMEKEEP_TIMEZONE in .env when deploying this project elsewhere.
      TZ: ${TIMEKEEP_TIMEZONE:-Europe/Amsterdam}
    volumes:
      - timekeep-data:/data
      # Enables the authenticated in-app updater to rebuild this compose
      # service in place. Remove this mount if updates should be manual only.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TIMETONE_HOST_ROOT:-..}:/host
volumes:
  timekeep-data:
